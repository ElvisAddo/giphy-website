<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giphy Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body><header class="header">
      <div class="header-container">
        <div class="logo-nav">
          <div class="logo">
            <span class="logo-icon">🎬</span>
            <span class="logo-text">GIPHY</span>
          </div>
          <nav class="nav">
            <a href="#" class="nav-link active">Reactions</a>
            <a href="#" class="nav-link">Entertainment</a>
            <a href="#" class="nav-link">Sports</a>
            <a href="#" class="nav-link">Stickers</a>
            <a href="#" class="nav-link">Artists</a>
            <button class="nav-more">⋯</button>
          </nav>
        </div>
        <div class="header-actions">
          <button class="btn-upload">Upload</button>
          <button class="btn-create">Create</button>
          <button class="btn-profile">👤</button>
          <button class="btn-login">Log In</button>
        </div>
      </div>
    </header>
<section class="search-section">
      <div class="search-container">
        <div class="search-bar">
          <!-- Removed nested form structure to make search bar span full width -->
          <input
            type="text"
            id="search-input"
            placeholder="Search GIPHY"
            value="food"
            class="search-input"
          />
          <button type="submit" id="search-btn" class="search-btn">🔍</button>
        </div>

        <div class="search-tags">
          <span class="tag">🔍 eating</span>
          <span class="tag">🔍 fight</span>
          <span class="tag">🔍 thanks</span>
          <span class="tag">🔍 let's eat</span>
          <span class="tag">🔍 happy</span>
          <span class="tag">🔍 hungry</span>
          <span class="tag">🔍 breakfast</span>
          <span class="tag">🔍 eat</span>
          <span class="tag">🔍 suhur</span>
        </div>

        <div class="channels">
          <div class="channels-header">
            <span class="channels-count">20 channels</span>
          </div>
          <div class="channels-list">
            <div class="channel">
              <div class="channel-avatar red">🍕</div>
              <div class="channel-info">
                <div class="channel-name">#Foodloversunite</div>
                <div class="channel-handle">@foodloversunite ✓</div>
              </div>
            </div>
            <div class="channel">
              <div class="channel-avatar blue">🍔</div>
              <div class="channel-info">
                <div class="channel-name">Foodies</div>
                <div class="channel-handle">@MarmiteOfficial ✓</div>
              </div>
            </div>
            <div class="channel">
              <div class="channel-avatar orange">🌭</div>
              <div class="channel-info">
                <div class="channel-name">Rappers As Food</div>
                <div class="channel-handle">@rappersasfood ✓</div>
              </div>
            </div>
            <div class="channel">
              <div class="channel-avatar brown">🍰</div>
              <div class="channel-info">
                <div class="channel-name">Foodgod</div>
                <div class="channel-handle">@foodgod ✓</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Content Section -->
    <section class="content-section">
      <div class="content-container">
        <div class="content-header">
          <div class="content-tabs">
            <button class="tab active">GIFs</button>
            <button class="tab">Stickers</button>
            <button class="tab">Clips</button>
          </div>
          <div class="content-controls">
            <button class="control-btn">🔀 Sort</button>
            <button class="control-btn">🔽 Filter</button>
          </div>
        </div>

        <!-- Updated gif-grid to be the results container for dynamic content -->
        <div id="results" class="gif-grid">
          <!-- Dynamic GIF results will be loaded here -->
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="footer-links">
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Terms</a>
      </div>
    </footer>

     <!-- Added jQuery CDN and index.js script -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
